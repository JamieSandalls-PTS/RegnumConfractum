<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum Confractum — Authoring</title>
<style>
  :root {
    --ink: #0b0a0c; --panel: #16151a; --line: #2a2830;
    --text: #b9b2a6; --dim: #6d6760; --warm: #c4703a; --bad: #c4553a; --good: #6f9a55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; font-size: 13px; }
  #wrap { display: flex; flex-direction: column; height: 100%; }

  /* The top row is the PRODUCTION LINE (D-629) — seven stages read left to
     right, each using what the one before it defined — and the row under it
     is the editors inside the stage. Both are rendered from a registry in
     creation-tool.ts; the markup here is the frame. */
  #sections { display: flex; gap: 2px; background: #100f13; border-bottom: 1px solid var(--line);
    padding: 0 10px; flex: none; }
  #sections button { background: none; border: 0; color: var(--dim); font: inherit;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    padding: 12px 16px; cursor: pointer; }
  #sections button:hover { color: var(--text); }
  #sections button.on { color: #e0d8c8; background: var(--panel); }
  #sections .grow { flex: 1; }
  #sections .status { color: var(--dim); font-size: 11px; align-self: center; padding-right: 6px; }
  /* What a stage has, and whether something in it is missing or unbuilt.
     The count is a size; the ⚠ is the thing to read. */
  #sections .badge { font-style: normal; margin-left: 7px; padding: 1px 5px; border-radius: 8px;
    background: #1f1d24; color: var(--dim); font-size: 10px; letter-spacing: 0; text-transform: none; }
  #sections .badge.warn { background: #3a2a1a; color: var(--warm); }
  #sections .status.good, #tabs .status.good { color: var(--good); }
  #sections .status.bad { color: var(--bad); }
  #tabs .status.warn { color: var(--warm); }
  #tabs .status { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Publish (D-630): the one control that carries a save into the game. */
  #publish { align-self: center; padding: 0 4px 0 10px; }
  #publish button { width: auto; margin: 0; padding: 4px 12px; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; }
  #publishlog { position: absolute; right: 12px; bottom: 12px; width: 440px; max-height: 40%;
    overflow-y: auto; background: #100f13; border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.5;
    z-index: 5; white-space: pre-wrap; }

  #tabs { display: flex; gap: 2px; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 0 10px; flex: none; }
  #tabs button { background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); font: inherit; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; padding: 11px 14px; cursor: pointer; }
  #tabs button:hover { color: var(--text); }
  #tabs button.on { color: var(--warm); border-bottom-color: var(--warm); }
  #tabs .grow { flex: 1; }
  #tabs .status { color: var(--dim); font-size: 11px; align-self: center; padding-right: 6px; }

  #body { flex: 1; display: flex; min-height: 0; }
  .pane { overflow-y: auto; padding: 12px; }
  #list { width: 380px; background: var(--panel); border-right: 1px solid var(--line); flex: none; }
  #stage { flex: 1; position: relative; min-width: 0; cursor: grab; }
  #stage.turning { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #side { width: 300px; background: var(--panel); border-left: 1px solid var(--line); flex: none; }
  /* The class editor is a form, not a property panel beside a 3D preview —
     with the stage hidden it should have the room the stage was using. */
  body.classes #side { width: auto; flex: 1; }
  body.classes #list { width: 320px; }
  .hidden { display: none !important; }
  /* The map editor is a whole tool already (D-543/544) with its own server and
     its own save validation. Embedding beats rebuilding: two editors writing
     the same area files would eventually disagree about what a legal map is. */
  #editor { flex: 1; border: 0; width: 100%; min-height: 0; background: var(--ink); }

  h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 10px; font-weight: 600; }
  h2 { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  label { display: block; color: var(--dim); font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em; margin: 10px 0 3px; }
  select, input, button, textarea {
    width: 100%; background: #0f0e12; color: var(--text); border: 1px solid var(--line);
    padding: 5px 7px; font: inherit; font-size: 12px; border-radius: 2px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--warm); }
  button { cursor: pointer; margin-top: 6px; background: #211f26; }
  button:hover:not(:disabled) { border-color: var(--warm); color: #e0d8c8; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2c2118; border-color: var(--warm); color: #e0d8c8; }
  /* A row in the LIST pane is a thing you pick, so it has to look like one.
     These were bare text on a panel: `.row` is a flex utility shared with the
     form rows in the side panel, and `.listrow` had no rule at all, so every
     list of feats, recipes, roamers, people, cues and garments read as a
     paragraph rather than as a column of choices.

     Scoped to `#list` on purpose: the same `.row` class lays out the label-
     and-field rows in `#side`, and boxing those would turn every form into a
     ladder. */
  #list .row, .listrow {
    border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; margin-bottom: 4px; cursor: pointer;
    background: #1a181e;
  }
  #list .row:hover, .listrow:hover { border-color: #4a4550; color: #e0d8c8; }
  #list .row.on, .listrow.on {
    border-color: var(--warm); color: #e0d8c8; background: #2c2118;
  }
  /* The sub-line inside a row (an id, a count, what it is made of). */
  .listrow .sub { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  /* The item list is a table rather than divs; give its rows the same edge. */
  #list tr { cursor: pointer; }
  #list tbody tr:hover td { background: #1f1d24; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { margin-top: 0; }
  /* One kit line: item, how many, worn-or-carried, remove. */
  .kitrow { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .kitrow select { flex: 1 1 auto; min-width: 0; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 12px; line-height: 1.55;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .warn { color: var(--warm); }
  .bad { color: var(--bad); }
  .good { color: var(--good); }

  /* the naming table — one row per part, name field always ready to type in */
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 4px 2px 0; vertical-align: middle; }
  td.stem { color: var(--dim); font-size: 10.5px; font-family: ui-monospace, monospace;
    white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  tr.on td.stem { color: var(--warm); }
  tr:hover td.stem { color: var(--text); }
  td.name input { padding: 3px 6px; }
  tr.named td.name input { border-color: #37502f; }
  .count { color: var(--dim); font-size: 11px; margin-bottom: 8px; }

  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 2px;
    padding: 2px 6px; margin: 0 4px 4px 0; font-size: 11px; cursor: pointer; }
  .chip.on { border-color: var(--warm); color: #e0d8c8; background: #2c2118; }
  .chip.bad { border-color: #5a2f26; color: var(--bad); }
  .chips { margin: 4px 0 8px; }

  /* The character studio's slot rows (D-558), now a tab of Bodies. */
  .slot { margin-bottom: 5px; }
  .slot > span { display: flex; justify-content: space-between; align-items: baseline;
    color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .slot > span b { color: var(--warm); font-weight: 600; }
  .slot > span i { font-style: normal; color: var(--warm); letter-spacing: 0; }
  .slot.required > span { color: var(--text); }
  .slot select { margin-top: 2px; }
  .slot.empty.required select { border-color: var(--bad); }
  .slot em { display: block; font-style: normal; font-size: 10px; color: var(--dim);
    letter-spacing: .04em; margin-top: 1px; }
  .slot.blocked > span, .slot.blocked select { opacity: .4; }
  .slot.blocked em { color: var(--warm); opacity: .8; }

  /* The cloth workbench's sliders and checks (D-520), now a tab of Bodies. */
  .sl { display: flex; align-items: center; gap: 8px; }
  .sl input[type=range] { flex: 1; padding: 0; }
  .sl b { width: 40px; text-align: right; font-weight: 400; font-size: 11px; color: var(--text); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
  .check input { width: auto; }
  .row2 { display: flex; gap: 4px; margin-top: 4px; }
  .row2 button { flex: 1; }
  #problems { margin-top: 10px; font-size: 11px; line-height: 1.5; }
  #problems .bad { color: var(--bad); }
  #problems .good { color: var(--good); }
  #problems .warn { color: var(--warm); }
  #banner { position: absolute; top: 10px; left: 14px; font-size: 11px; color: var(--dim);
    letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
  <div id="wrap">
    <!-- Art → Motion → Bodies → Things → World → Rules → Scenario.
         Rendered by `renderStageBar()`; the status line lives in it. -->
    <div id="sections"><span class="grow"></span><span class="status" id="status"></span></div>

    <!-- The editors inside the chosen stage. Rendered by `renderTabBar()`. -->
    <div id="tabs"><span class="grow"></span></div>

    <div id="body">
      <div id="list" class="pane"></div>
      <div id="stage"><div id="banner"></div></div>
      <div id="side" class="pane"></div>
    </div>
    <div id="soon" class="pane hidden"></div>
    <div id="publishlog" class="hidden"></div>
    <iframe id="editor" class="hidden" title="Map builder"></iframe>
  </div>
  <script type="module" src="/src/creation-tool.ts"></script>
</body>
</html>
