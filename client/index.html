<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum Confractum</title>
<style>
  /* Interface doctrine (D-306): dark, low-chroma, warm candlelight accents.
     A reading application first — legibility beats atmosphere on UI surfaces. */
  :root {
    --ink: #0b0a0c;
    --panel: #16151a;
    --line: #2a2830;
    --text: #b9b2a6;
    --dim: #6d6760;
    --warm: #c4703a;
    --bad: #b05348;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #141218 0%, var(--ink) 75%);
  }
  .panel {
    width: 340px; background: var(--panel); border: 1px solid var(--line);
    padding: 28px; border-radius: 3px;
  }
  .panel h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 2px; font-weight: 600; }
  .panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .panel label { display: block; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em; margin: 12px 0 4px; }
  .panel input {
    width: 100%; background: #0f0e12; color: var(--text); border: 1px solid var(--line);
    padding: 8px 10px; font: inherit; font-size: 13px; border-radius: 2px; outline: none;
  }
  .panel input:focus { border-color: var(--warm); }
  .panel button {
    background: #211f26; color: var(--text); border: 1px solid var(--line);
    padding: 9px 14px; font: inherit; font-size: 12px; cursor: pointer;
    border-radius: 2px; margin-top: 16px;
  }
  .panel button:hover { background: #2c2933; color: #e0d8c8; }
  .panel button.primary { background: var(--warm); color: #140d07; border-color: var(--warm); }
  .panel button.primary:hover { background: #d8854c; }
  .panel .row { display: flex; gap: 8px; }
  .panel .row button { flex: 1; }
  #status-msg { color: var(--bad); font-size: 12px; min-height: 16px; margin-top: 12px; }
  .charlist { margin: 4px 0 0; padding: 0; list-style: none; }
  .charlist li {
    border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; margin-bottom: 6px;
    cursor: pointer; font-size: 13px; display: flex; justify-content: space-between;
  }
  .charlist li:hover { border-color: var(--warm); color: #e0d8c8; }
  .charlist .where { color: var(--dim); font-size: 11px; }
  .hidden { display: none !important; }

  #hud {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px;
    font-size: 12px; color: var(--dim); display: flex; gap: 18px;
    background: linear-gradient(transparent, rgba(11,10,12,.85) 40%);
    pointer-events: none;
  }
  #hud b { color: var(--text); font-weight: 400; }

  /* Chat: the most-used surface in the game — legibility beats atmosphere
     here (D-306). */
  #chat {
    position: absolute; left: 12px; bottom: 64px; width: 460px; max-width: 60vw;
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
    font-size: 13.5px; line-height: 1.45;
  }
  #chat-log {
    overflow-y: auto; max-height: 34vh; padding: 6px 10px;
    background: rgba(11, 10, 12, 0.72); border-radius: 3px;
    pointer-events: auto; scrollbar-width: thin;
  }
  #chat-log .line { margin: 2px 0; color: var(--text); overflow-wrap: break-word; }
  #chat-log .who { color: #d9cdb4; }
  #chat-log .whisper { color: #948d9e; font-style: italic; }
  #chat-log .shout .who, #chat-log .shout { color: #d8a05c; }
  #chat-log .emote-text { color: #b79a6e; font-style: italic; }
  #chat-log .impression { color: #b0685c; font-style: italic; font-size: 12.5px; }
  #chat-log .system { color: var(--dim); font-style: italic; font-size: 12.5px; }
  #chat-log .tongue { color: #8b95a5; font-style: italic; }
  #chat-log .narration { color: #a89878; font-style: italic; text-align: center; margin: 6px 0; }
  /* In-world documents render as pages: serif, per D-306. */
  #chat-log .document {
    font-family: Georgia, 'Times New Roman', serif;
    background: #1b1712; border: 1px solid #3a3427; border-radius: 2px;
    padding: 8px 12px; margin: 5px 0; color: #cfc2a8; white-space: pre-wrap;
  }
  #chat-log .document .doc-title { color: #dcc99c; font-weight: 600; margin-bottom: 4px; }
  #chat-bar {
    display: none; gap: 6px; margin-top: 6px; pointer-events: auto;
  }
  #chat-bar.open { display: flex; }
  #chat-bar input {
    background: rgba(15, 14, 18, 0.92); color: var(--text);
    border: 1px solid var(--line); padding: 7px 10px; font: inherit;
    border-radius: 2px; outline: none;
  }
  #chat-bar input:focus { border-color: var(--warm); }
  #in-declare { width: 120px; }
  #in-declare.armed { border-color: var(--warm); color: #e8c88f; }
  #in-chat { flex: 1; }
  #chat-hint {
    position: absolute; left: 12px; bottom: 40px; color: var(--dim);
    font-size: 11.5px; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="chat" class="hidden">
    <div id="chat-log"></div>
    <div id="chat-bar">
      <input id="in-declare" placeholder="declare as…" spellcheck="false" autocomplete="off"
             title="Speak under a name — yours, or any other. Listeners may see through it.">
      <input id="in-chat" placeholder="say something… (*emotes* animate; /w whisper, /y shout)"
             spellcheck="false" autocomplete="off" maxlength="400">
    </div>
  </div>
  <div id="chat-hint" class="hidden">Enter to speak</div>
  <div id="hud" class="hidden">
    <span id="hud-area"></span>
    <span>pos <b id="hud-pos">–</b></span>
    <span>coin <b id="hud-coin">0</b></span>
    <span id="hud-conn"></span>
    <span style="margin-left:auto">move: WASD / arrows</span>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>Regnum Confractum</h1>
      <div class="sub">the broken realm</div>

      <div id="login-form">
        <label>server</label>
        <input id="in-server" spellcheck="false">
        <label>username</label>
        <input id="in-user" spellcheck="false" autocomplete="username">
        <label>password</label>
        <input id="in-pass" type="password" autocomplete="current-password">
        <div class="row">
          <button id="btn-login" class="primary">Enter</button>
          <button id="btn-register">Register</button>
        </div>
      </div>

      <div id="char-form" class="hidden">
        <label>your characters</label>
        <ul id="char-list" class="charlist"></ul>
        <label>or begin someone new</label>
        <input id="in-charname" placeholder="a name they will answer to" spellcheck="false">
        <button id="btn-create" class="primary">Create &amp; enter</button>
      </div>

      <div id="status-msg"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
