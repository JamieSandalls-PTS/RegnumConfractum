<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum Confractum — Character Studio</title>
<style>
  :root {
    --ink: #0b0a0c; --panel: #16151a; --line: #2a2830;
    --text: #b9b2a6; --dim: #6d6760; --warm: #c4703a; --bad: #c4553a; --good: #6f9a55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; font-size: 13px; }
  #wrap { display: flex; height: 100%; }
  #slots { width: 250px; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 10px; flex: none; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #side { width: 260px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 12px; flex: none; }

  h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 10px; font-weight: 600; }
  h2 { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  label { display: block; color: var(--dim); font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em; margin: 10px 0 3px; }
  select, input, button, textarea {
    width: 100%; background: #0f0e12; color: var(--text); border: 1px solid var(--line);
    padding: 5px 7px; font: inherit; font-size: 12px; border-radius: 2px; outline: none;
  }
  button { cursor: pointer; margin-top: 6px; background: #211f26; }
  button:hover:not(:disabled) { border-color: var(--warm); color: #e0d8c8; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2c2118; border-color: var(--warm); color: #e0d8c8; }

  .slot { margin-bottom: 5px; }
  .slot > span { display: flex; justify-content: space-between; align-items: baseline;
    color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .slot > span b { color: var(--warm); font-weight: 600; }
  .slot.required > span { color: var(--text); }
  .slot select { margin-top: 2px; }
  label i { font-style: normal; color: var(--warm); float: right; letter-spacing: 0; }
  #views button { margin-top: 2px; padding: 3px 0; font-size: 11px; }
  #stage { cursor: grab; }
  #stage.turning { cursor: grabbing; }
  .slot.empty.required select { border-color: var(--bad); }
  .slot em { display: block; font-style: normal; font-size: 10px; color: var(--dim);
    letter-spacing: .04em; margin-top: 1px; }
  .slot.blocked > span, .slot.blocked select { opacity: .4; }
  .slot.blocked em { color: var(--warm); opacity: .8; }

  #problems { margin-top: 10px; font-size: 11px; line-height: 1.5; }
  #problems .bad { color: var(--bad); }
  #problems .good { color: var(--good); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 12px; line-height: 1.5;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .row { display: flex; gap: 6px; }
  .check { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 12px; }
  .check input { width: auto; }
  #banner { position: absolute; top: 10px; left: 14px; font-size: 11px; color: var(--dim);
    letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="slots">
      <h1>Parts</h1>
      <div id="slotlist"></div>
    </div>

    <div id="stage"><div id="banner"></div></div>

    <div id="side">
      <h1>Character</h1>

      <label for="in-saved">Open</label>
      <select id="in-saved"><option value="">— new character —</option></select>

      <label for="in-pack">Pack</label>
      <select id="in-pack"></select>

      <label for="in-sex">Body</label>
      <select id="in-sex">
        <option value="male">male</option>
        <option value="female">female</option>
      </select>

      <label for="in-id">Id</label>
      <input id="in-id" placeholder="knight-male" spellcheck="false">

      <label for="in-name">Name</label>
      <input id="in-name" placeholder="Knight">

      <label for="in-texture">Colour atlas</label>
      <select id="in-texture"></select>

      <label for="in-note">Note</label>
      <textarea id="in-note" rows="2" placeholder="what this is for"></textarea>

      <h2>Preview</h2>
      <label for="in-clip">Animation</label>
      <select id="in-clip"></select>
      <label for="in-render">Render</label>
      <select id="in-render">
        <option value="raw">raw — no filter</option>
        <option value="split">split pixelation (in-game)</option>
      </select>
      <label for="in-speed">Speed <i id="lbl-speed">1.0&times;</i></label>
      <input id="in-speed" type="range" min="0" max="1.5" step="0.05" value="1">
      <label for="in-angle">Angle <i id="lbl-angle">0&deg;</i></label>
      <input id="in-angle" type="range" min="0" max="359" step="1" value="0">
      <div class="row" id="views">
        <button data-deg="90">Front</button>
        <button data-deg="180">Side</button>
        <button data-deg="270">Back</button>
      </div>
      <label for="in-zoom">Zoom</label>
      <input id="in-zoom" type="range" min="0.04" max="1.0" step="0.01" value="0.20">
      <div class="check"><input id="in-spin" type="checkbox"><label for="in-spin"
        style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)">Orbit</label></div>
      <div class="hint" style="border:0;padding-top:6px;margin-top:2px">Drag the
        stage to turn it, wheel to zoom. Speed 0 freezes a frame &mdash; a bad
        limb is far easier to see stopped than moving.</div>

      <h2>Save</h2>
      <button id="btn-random">Randomise</button>
      <button id="btn-save" class="primary">Save to content</button>
      <div id="problems"></div>

      <div class="hint">Saving writes a small definition to
        <code>content/characters/</code> — the art stays out of git, the choice
        goes in. Then <code>npm run build:characters</code>.</div>
    </div>
  </div>
  <script type="module" src="/src/studio.ts"></script>
</body>
</html>
