<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum Confractum — Character Viewer</title>
<style>
  :root {
    --ink: #0b0a0c; --panel: #16151a; --line: #2a2830;
    --text: #b9b2a6; --dim: #6d6760; --warm: #c4703a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 260px 0 0; }
  #stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 260px;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; font-size: 12.5px;
  }
  #panel h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 2px; font-weight: 600; }
  #panel .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  #panel label { display: block; color: var(--dim); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .1em; margin: 12px 0 4px; }
  #panel select, #panel input, #panel button {
    width: 100%; background: #0f0e12; color: var(--text); border: 1px solid var(--line);
    padding: 6px 8px; font: inherit; font-size: 12px; border-radius: 2px; outline: none;
  }
  #panel button { cursor: pointer; margin-top: 6px; background: #211f26; }
  #panel button:hover { border-color: var(--warm); color: #e0d8c8; }
  #panel .row { display: flex; gap: 6px; }
  #panel .check { display: flex; align-items: center; gap: 8px; margin-top: 8px;
    color: var(--text); font-size: 12px; }
  #panel .check input { width: auto; }
  #panel .hint { color: var(--dim); font-size: 11px; margin-top: 14px; line-height: 1.5; }
  #seeds { color: var(--dim); font-size: 10.5px; margin-top: 10px; line-height: 1.6;
    word-break: break-all; }
  .hidden { display: none !important; }
  #editor label { margin-top: 8px; }
  /* Tabs: one live scene, four groups of controls over it. */
  #tabs { display: flex; gap: 0; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  #tabs .tab {
    flex: 1; width: auto; margin: 0; padding: 7px 4px; font-size: 11px;
    letter-spacing: .06em; text-transform: uppercase; background: transparent;
    border: none; border-bottom: 2px solid transparent; color: var(--dim);
    cursor: pointer; border-radius: 0;
  }
  #tabs .tab:hover { color: var(--text); background: transparent; }
  #tabs .tab.active { color: var(--warm); border-bottom-color: var(--warm); }
  #panel .sl { display: flex; align-items: center; gap: 8px; }
  #panel .sl input[type=range] { flex: 1; }
  #panel .sl b { width: 34px; text-align: right; font-weight: 400; font-size: 11px;
    font-family: monospace; color: var(--text); }
  #editor .sl { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #editor .sl span { width: 14px; color: var(--dim); font-size: 10px; }
  #editor .sl input[type=range] { flex: 1; padding: 0; }
  #editor .sl b { width: 46px; font-weight: 400; font-size: 10px; color: var(--text); }
  #editor textarea { width: 100%; height: 90px; background: #0f0e12; color: var(--text);
    border: 1px solid var(--line); font-size: 10px; font-family: monospace; }
  #editor .row2 { display: flex; gap: 4px; margin-top: 4px; }
  #panel .row2 { display: flex; gap: 4px; margin-top: 4px; }
  #panel .row2 button { flex: 1; }
  #panel textarea { width: 100%; background: #0f0e12; color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; margin-top: 4px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h1>Character Viewer</h1>
    <div class="sub">one live scene — each tab configures a different part</div>

    <!-- ⚠ A PLACEHOLDER body (D-617). The procedural cast this page was
         built to browse is deleted; what is tuned here is tuned against a
         jointed stand-in at roughly human proportions, not against the art. -->
    <p class="note">Tuning against a <b>placeholder</b> body — a jointed stand-in,
       not the cast.</p>
    <section data-panel="cloth">
      <label>all garments — fidelity (segments; rebuilds)</label>
      <div class="sl"><input id="in-clothfid" type="range" min="0.5" max="2.5" step="0.1" value="1"><b id="v-clothfid">1.0×</b></div>
      <label>all garments — floppiness (fewer passes = looser)</label>
      <div class="sl"><input id="in-clothiter" type="range" min="1" max="10" step="1" value="6"><b id="v-clothiter">6</b></div>
      <div id="cloth-panel"></div>
    </section>

    <section data-panel="render">
      <label>lighting</label>
    <select id="in-light">
      <option value="overcast">overcast (outdoor)</option>
      <option value="interior">interior</option>
      <option value="underground">underground</option>
      <option value="night">night</option>
    </select>
    </section>

    <div class="hint">
      Drag to orbit · wheel to zoom. Quote a seed when giving feedback and
      it can be reproduced exactly.
    </div>
  </div>
  <script type="module" src="/src/viewer.ts"></script>
</body>
</html>
