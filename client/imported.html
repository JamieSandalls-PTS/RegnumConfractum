<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum Confractum — Imported vs Procedural</title>
<style>
  :root {
    --ink: #0b0a0c; --panel: #16151a; --line: #2a2830;
    --text: #b9b2a6; --dim: #6d6760; --warm: #c4703a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 250px 0 0; }
  #stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 250px;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; font-size: 12.5px;
  }
  h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; line-height: 1.5; }
  label { display: block; color: var(--dim); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .1em; margin: 14px 0 4px; }
  select, input, button {
    width: 100%; background: #0f0e12; color: var(--text); border: 1px solid var(--line);
    padding: 6px 8px; font: inherit; font-size: 12px; border-radius: 2px; outline: none;
  }
  button { cursor: pointer; margin-top: 6px; background: #211f26; }
  button:hover { border-color: var(--warm); color: #e0d8c8; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .check input { width: auto; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 16px; line-height: 1.55;
    border-top: 1px solid var(--line); padding-top: 12px; }
  #status { color: var(--dim); font-size: 11px; margin-top: 10px; line-height: 1.5; }
  #status.bad { color: #c4553a; }
  .labels { position: absolute; top: 14px; left: 18px; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .labels b { color: var(--warm); font-weight: 600; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="labels">left <b>procedural</b> &nbsp;·&nbsp; right <b>imported</b></div>
  <div id="panel">
    <h1>Imported models</h1>
    <div class="sub">Synty Sidekick meshes, Mixamo animations, retargeted by
      <code>npm run build:characters</code>. Nothing here was touched by hand.</div>

    <label for="in-outfit">Outfit</label>
    <select id="in-outfit"></select>

    <label for="in-clip">Animation</label>
    <select id="in-clip"></select>

    <label for="in-render">Render</label>
    <select id="in-render">
      <option value="raw">raw — no filter</option>
      <option value="split" selected>split pixelation (in-game)</option>
      <option value="uniform">uniform pixelation</option>
    </select>

    <label for="in-zoom">Zoom</label>
    <input id="in-zoom" type="range" min="0.08" max="1.2" step="0.02" value="0.28">

    <div class="check"><input id="in-spin" type="checkbox" checked><label for="in-spin" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)">Orbit</label></div>
    <div class="check"><input id="in-both" type="checkbox" checked><label for="in-both" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)">Show the procedural one too</label></div>

    <div id="status"></div>

    <div class="hint">The filter is a toggle, not a commitment — if the imported
      models stand on their own, <em>raw</em> is what shipping looks like.</div>
  </div>
  <script type="module" src="/src/imported.ts"></script>
</body>
</html>
