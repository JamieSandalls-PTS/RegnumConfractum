<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Procedural Character Prototype</title>
<style>
  :root {
    --ink: #0b0a0c;
    --panel: #16151a;
    --line: #2a2830;
    --text: #b9b2a6;
    --dim: #6d6760;
    --warm: #c4703a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--ink); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  #stage { position:absolute; inset:0; }
  canvas { display:block; width:100%; height:100%; image-rendering: pixelated; }

  #panel {
    position:absolute; top:0; left:0; width:250px; height:100%;
    background: var(--panel); border-right:1px solid var(--line);
    padding:16px; overflow-y:auto; font-size:11px; line-height:1.5;
  }
  #panel h1 { font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--warm); margin:0 0 4px; font-weight:600; }
  #panel .sub { color:var(--dim); font-size:10px; margin-bottom:18px; }
  .group { margin-bottom:18px; }
  .group > label { display:block; color:var(--dim); text-transform:uppercase;
    letter-spacing:.1em; font-size:9px; margin-bottom:6px; }
  button {
    background:#211f26; color:var(--text); border:1px solid var(--line);
    padding:6px 8px; font:inherit; font-size:10px; cursor:pointer; margin:0 3px 3px 0;
    border-radius:2px;
  }
  button:hover { background:#2c2933; color:#e0d8c8; }
  button.on { background:var(--warm); color:#140d07; border-color:var(--warm); }
  #regen { width:100%; padding:9px; margin-bottom:4px; background:#2c2933; }
  input[type=range] { width:100%; accent-color:var(--warm); }
  .row { display:flex; justify-content:space-between; color:var(--dim); font-size:10px; }
  .stat { color:var(--dim); font-size:10px; }
  .stat b { color:var(--text); font-weight:400; }
  #err { position:absolute; bottom:0; left:250px; right:0; background:#3a1010;
    color:#ffb4b4; padding:8px 12px; font-size:11px; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>Procedural Characters</h1>
  <div class="sub">Rule-built geometry · procedural animation · verlet cloth · palette-quantised</div>

  <div class="group">
    <button id="regen">⟳ Regenerate Population</button>
    <div class="stat" id="seedinfo"></div>
  </div>

  <div class="group">
    <label>Animation</label>
    <div id="anims"></div>
  </div>

  <div class="group">
    <label>Wind <span id="windv" class="stat"></span></label>
    <input type="range" id="wind" min="0" max="100" value="30">
  </div>

  <div class="group">
    <label>Pixel scale <span id="pixv" class="stat"></span></label>
    <input type="range" id="pix" min="1" max="8" value="4">
  </div>

  <div class="group">
    <label>Render</label>
    <button id="tPalette" class="on">Palette</button>
    <button id="tDither" class="on">Dither</button>
    <button id="tRotate" class="on">Turntable</button>
  </div>

  <div class="group">
    <label>Frame</label>
    <div class="row"><span>fps</span><span class="stat"><b id="fps">–</b></span></div>
    <div class="row"><span>internal res</span><span class="stat"><b id="res">–</b></span></div>
    <div class="row"><span>tris</span><span class="stat"><b id="tris">–</b></span></div>
  </div>

  <div class="group" style="border-top:1px solid var(--line); padding-top:12px;">
    <div class="stat" style="line-height:1.6">
      Every character here is generated from a
      parameter vector — no meshes, no keyframes,
      no sprite sheets. Cape and hair are verlet
      chains solved each frame.
    </div>
  </div>
</div>
<div id="err"></div>
